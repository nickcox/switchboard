# Runs type checking and the test suite on each host platform (ADR-0004). Passing here is necessary but not sufficient
# for supporting a platform: a real dispatch (investigations/real-dispatch) must also pass on a native host.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TREEHOUSE_VERSION: v3.1.4

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        # The suite is split by file into three jobs per platform, which run at the same time.
        shard: [1, 2, 3]
        # Windows runs take several times longer, so they run only for main, pull requests and manual runs, not for
        # every push to another branch.
        os: ${{ fromJSON((github.event_name != 'push' || github.ref == 'refs/heads/main') && '["macos-latest", "ubuntu-latest", "windows-latest"]' || '["macos-latest", "ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Treehouse (macOS and Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) asset=darwin-arm64.tar.gz; sha256=dd59e3c10549a565d68cd8e98f477c41361678b9f95abc7f1e0fc53bb43587ea ;;
            Linux) asset=linux-amd64.tar.gz; sha256=a169277ffdc5f48b51a4b53ce6c2e46fe3c222a5017c67f72bf9260a9b382ae2 ;;
          esac
          name="treehouse-${TREEHOUSE_VERSION}-${asset}"
          curl -fsSL -o "$RUNNER_TEMP/$name" "https://github.com/kunchenguid/treehouse/releases/download/${TREEHOUSE_VERSION}/$name"
          echo "${sha256}  $RUNNER_TEMP/$name" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/treehouse"
          tar -xzf "$RUNNER_TEMP/$name" -C "$RUNNER_TEMP/treehouse"
          echo "$RUNNER_TEMP/treehouse" >> "$GITHUB_PATH"

      - name: Install Treehouse (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "treehouse-$env:TREEHOUSE_VERSION-windows-amd64.zip"
          $sha256 = "0a745ca15f0a39257d55d0d94b01cab43a6c5d894ca00d1d5ac6753d4257cc94"
          $archive = Join-Path $env:RUNNER_TEMP $name
          Invoke-WebRequest -Uri "https://github.com/kunchenguid/treehouse/releases/download/$env:TREEHOUSE_VERSION/$name" -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $sha256) { throw "Checksum mismatch for ${name}: $actual" }
          $destination = Join-Path $env:RUNNER_TEMP "treehouse"
          Expand-Archive -Path $archive -DestinationPath $destination
          Add-Content -Path $env:GITHUB_PATH -Value $destination

      - run: treehouse --version
      - run: npm ci
      - run: npm run check

      # npm test with this job's share of the test files. Node applies --test-shard only before the file pattern.
      - run: node --test --test-timeout=30000 --test-shard=${{ matrix.shard }}/3 "tests/**/*.test.ts"

      # ADR-0007's evidence that SQLite's locking and crash behaviour hold on each platform.
      - if: matrix.shard == 1
        run: node investigations/sqlite-trial/trial.ts

  # One check that passes only when every job above passed.
  tests-passed:
    name: Tests passed
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: needs.test.result != 'success'
        run: exit 1
